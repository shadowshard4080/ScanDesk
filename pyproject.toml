[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scandesk"
dynamic = ["version"]
description = "Scan, copy and print documents on Linux using SANE and CUPS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shadowshard" }]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "Pillow>=9.0",
]
keywords = ["scanner", "scanning", "sane", "cups", "pdf", "printing", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
    "Topic :: Printing",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.gui-scripts]
scandesk = "scandesk:main"

[tool.setuptools]
py-modules = ["scandesk"]

[tool.setuptools.dynamic]
version = { attr = "scandesk.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
